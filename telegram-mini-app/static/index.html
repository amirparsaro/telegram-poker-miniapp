<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Poker Mini App</title>
  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="table-title">
        <span class="title-text" id="table-display-name">♠ TEXAS HOLD'EM</span>
        <span class="status-badge" id="stage-badge">WAITING</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-tables">🎲 Rooms</button>
        <button class="icon-btn" id="btn-add-bot">+ Bot</button>
        <button class="icon-btn admin-toggle-btn" id="btn-admin-panel">⚙️ Admin</button>
      </div>
    </header>

    <!-- Table Canvas Area -->
    <main class="table-container">
      <div class="poker-felt">
        <!-- Center: Pot & Community Cards -->
        <div class="table-center">
          <div class="pot-badge">
            <span class="pot-label">POT</span>
            <span class="pot-amount" id="pot-amount">0</span>
            <span style="font-size: 13px;">🪙</span>
          </div>
          <div class="community-cards" id="community-cards">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Seats Ring -->
        <div class="seats-grid" id="seats-container">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </main>

    <!-- Status & Game Log Banner -->
    <div class="game-log-banner" id="game-log">
      <span>Welcome to Telegram Poker Mini App!</span>
    </div>

    <!-- Bottom Controls Panel -->
    <footer class="action-panel">
      <!-- In-Game Betting Actions -->
      <div id="controls-playing" style="display: none; flex-direction: column; gap: 8px;">
        <div class="raise-slider-box">
          <span style="font-size: 11px; font-weight: 700; color: #9ca3af;">RAISE</span>
          <input type="range" id="raise-slider" class="raise-slider" min="20" max="200" step="20" value="20">
          <span class="raise-amount-tag" id="raise-amount-val">+20</span>
        </div>
        <div class="action-buttons">
          <button class="btn-action btn-fold" id="btn-fold">
            <span>FOLD</span>
            <span class="btn-subtext">Give Up</span>
          </button>
          <button class="btn-action btn-call" id="btn-call">
            <span id="btn-call-label">CHECK</span>
            <span class="btn-subtext">Match Bet</span>
          </button>
          <button class="btn-action btn-raise" id="btn-raise">
            <span id="btn-raise-label">RAISE</span>
            <span class="btn-subtext">Increase</span>
          </button>
        </div>
      </div>

      <!-- Pre-Game / Next Hand Controls -->
      <div id="controls-waiting">
        <button class="btn-start-game" id="btn-start-game">Deal New Hand</button>
      </div>
    </footer>

    <!-- MODAL: Win / Result Celebration Screen -->
    <div class="modal-overlay" id="modal-winner" style="display: none;">
      <div class="modal-card winner-modal">
        <div class="win-trophy">🏆</div>
        <div class="modal-title win-title" id="win-headline">WINNER!</div>
        <div class="win-pot-tag" id="win-pot-tag">+500 🪙</div>
        <div class="modal-desc" id="win-desc">Fold or showdown details</div>
        <div id="win-showdown-hands" class="win-hands-list" style="display: none;"></div>
        <button class="modal-btn win-btn" id="btn-win-next-hand">Next Hand (Start New Round)</button>
      </div>
    </div>

    <!-- MODAL: Rooms / Tables Switcher -->
    <div class="modal-overlay" id="modal-rooms" style="display: none;">
      <div class="modal-card">
        <div class="modal-title">🎲 Poker Rooms & Live Games</div>
        
        <!-- Player Create Room Row -->
        <div class="create-room-box">
          <input type="text" id="player-new-room-name" class="admin-input" placeholder="New room name (e.g. Friendly Game)">
          <button class="modal-btn" id="btn-player-create-room" style="white-space: nowrap; width: auto; padding: 9px 14px;">+ Create</button>
        </div>

        <div class="rooms-list" id="rooms-list-container">
          <!-- Populated by JS -->
        </div>
        <button class="modal-btn secondary-btn" id="btn-close-rooms" style="margin-top: 14px;">Close</button>
      </div>
    </div>

    <!-- MODAL: Admin Control Center -->
    <div class="modal-overlay" id="modal-admin" style="display: none;">
      <div class="modal-card admin-modal">
        <div class="modal-title">👑 Admin Control Center</div>

        <!-- Password gate if not yet authorized -->
        <div id="admin-login-box">
          <p class="modal-desc">Enter admin secret password:</p>
          <input type="password" id="admin-pass-input" class="admin-input" placeholder="Password">
          <button class="modal-btn" id="btn-admin-submit-pass" style="margin-top: 10px;">Authorize</button>
        </div>

        <!-- Admin Controls Panel -->
        <div id="admin-actions-box" style="display: none;">
          <div class="admin-section">
            <div class="admin-section-title">Game Controls</div>
            <div class="admin-button-row">
              <button class="admin-btn warning-btn" id="btn-admin-force-start">⚡ Force Start Hand</button>
              <button class="admin-btn danger-btn" id="btn-admin-reset-hand">🔄 Reset Table</button>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-section-title">Manage Rooms</div>
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
              <input type="text" id="admin-new-room-name" class="admin-input" placeholder="New room name (e.g. VIP Club)">
              <button class="admin-btn" id="btn-admin-create-room" style="white-space: nowrap;">+ Create</button>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-section-title">Manage Current Players</div>
            <div id="admin-players-list" class="admin-players-list">
              <!-- Rendered by JS -->
            </div>
          </div>

          <div style="margin-top: 14px;">
            <button class="modal-btn danger-btn" id="btn-admin-logout" style="background: #dc2626; color: #fff;">Log Out from Admin</button>
          </div>
        </div>

        <button class="modal-btn secondary-btn" id="btn-close-admin" style="margin-top: 14px;">Close</button>
      </div>
    </div>

  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
